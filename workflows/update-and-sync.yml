name: Update CSV and Sync to Supabase

on:
  schedule:
    - cron: '0 * * * *' # Berjalan setiap 1 jam sekali (bisa diubah sesuai kebutuhan)
  workflow_dispatch:     # Memungkinkan Anda menjalankan manual lewat tab Actions di GitHub

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 2. Install dependencies yang dibutuhkan (Pandas & Supabase client)
      - name: Install dependencies
        uses: py-actions/dependency-review-action@v3 # Opsional, atau langsung pip install:
        run: |
          pip install pandas supabase requests

      # 3. Jalankan skrip pembuat/pembaharu CSV Anda yang sudah ada
      - name: Run CSV Generator Script
        run: python generate_csv.py # Ganti dengan nama file skrip pembuat CSV Anda

      # 4. Jalankan skrip sinkronisasi ke Supabase
      - name: Run Supabase Sync Script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python sync_to_supabase.py